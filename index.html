<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card | Uzi Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link 
    href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet"/>
    <link 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"
    />
    
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="image/IMG_20250903_073823.png" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Muhammad Uzair</span>
            <span class="job">Front-end Developer</span>
        </div>

        <div class="media-buttons">
            <a href="https://x.com/UziSolutions" style="background:#14171A " class="link">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://github.com/MuhammadUzairKhalid15" style="background:#171515" class="link">
                <i class="bx bxl-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/uzi-solutions/" style="background:#0077B5" class="link">
                <i class="bx bxl-linkedin"></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class="bx bx-heart"> 163k</i>
            </div>
            <div class="data">
                <i class="bx bx-message"> 59k</i>
            </div>
            <div class="data">
                <i class="bx bx-share"> 33k</i>
            </div>
        </div>
    </div>
</body>
</html>
